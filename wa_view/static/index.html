<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp — Visualizador forense</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='12' fill='%2300a884'/%3E%3C/svg%3E">
</head>
<body>
<div id="app" class="app">
  <aside id="sidebar" class="sidebar">
    <header class="pane-header">
      <div class="avatar avatar-40" data-avatar="me"></div>
      <div class="header-icons">
        <button class="icon-btn" id="btn-upload" title="Carregar export (.zip)" data-icon="upload"></button>
        <button class="icon-btn" id="btn-calls" title="Chamadas" data-icon="call"></button>
        <button class="icon-btn" id="btn-media-panel" title="Análise forense de mídias" data-icon="chart"></button>
        <button class="icon-btn" id="btn-case-info" title="Informações do caso" data-icon="menu"></button>
      </div>
    </header>
    <div class="search-bar">
      <div class="search-box">
        <span class="search-icon" data-icon="search"></span>
        <input id="chat-search" type="text" placeholder="Pesquisar ou começar uma nova conversa" autocomplete="off">
      </div>
    </div>
    <div class="chip-row" id="chat-filters" role="tablist" aria-label="Filtrar conversas">
      <button class="chip active" data-filter="all" role="tab">Tudo</button>
      <button class="chip" data-filter="individual" role="tab">Individuais</button>
      <button class="chip" data-filter="group" role="tab">Grupos</button>
      <button class="chip" data-filter="media" role="tab">Com mídia</button>
    </div>
    <div id="chat-list" class="chat-list" role="list"></div>
    <div id="calls-panel" class="calls-panel" hidden></div>
  </aside>

  <main id="main" class="main">
    <section id="intro" class="intro">
      <div class="intro-inner">
        <div class="intro-art" data-icon="intro"></div>
        <h1>WhatsApp Web</h1>
        <p id="intro-summary">Carregando export…</p>
        <p class="intro-note" id="intro-note">Visualização forense somente leitura. Selecione uma conversa à esquerda para exibir as mensagens.</p>
        <div id="upload-zone" class="upload-zone"></div>
        <div class="intro-lock"><span data-icon="lock"></span> Os dados exibidos provêm exclusivamente do export carregado.</div>
      </div>
    </section>

    <section id="media-panel" class="media-panel" hidden></section>

    <section id="conversation" class="conversation" hidden>
      <header class="pane-header chat-header">
        <div class="avatar avatar-40" id="chat-avatar"></div>
        <div class="chat-title" id="btn-chat-info" title="Dados do contato / grupo">
          <div class="chat-name" id="chat-name"></div>
          <div class="chat-sub" id="chat-sub"></div>
        </div>
        <div class="header-icons">
          <button class="icon-btn" id="btn-msg-search" title="Pesquisar nesta conversa" data-icon="search"></button>
          <button class="icon-btn" id="btn-chat-menu" title="Dados do contato / grupo" data-icon="menu"></button>
        </div>
      </header>
      <div id="messages" class="messages" tabindex="0"></div>
      <footer class="composer">
        <span class="icon-btn disabled" data-icon="emoji"></span>
        <span class="icon-btn disabled" data-icon="attach"></span>
        <div class="composer-input">Visualização forense — somente leitura</div>
        <span class="icon-btn disabled" data-icon="mic"></span>
      </footer>
    </section>
  </main>

  <aside id="drawer" class="drawer" hidden>
    <header class="pane-header drawer-header">
      <button class="icon-btn" id="btn-drawer-close" title="Fechar" data-icon="close"></button>
      <div class="drawer-title" id="drawer-title"></div>
    </header>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>
</div>

<div id="upload-modal" class="modal" hidden></div>
<div id="viewer" class="viewer" hidden></div>
<input type="file" id="upload-input" accept=".zip,application/zip,application/x-zip-compressed" hidden>

<div id="lightbox" class="lightbox" hidden>
  <button class="icon-btn lightbox-close" data-icon="close" title="Fechar"></button>
  <div class="lightbox-content"></div>
</div>

<script src="/static/icons.js"></script>
<script src="/static/app.js"></script>
<script src="/static/media.js"></script>
</body>
</html>
